[package]
name = "craft-a-server-cli"
description = "craft-a-server command line: servers, backups, logs, diagnose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "craft-a-server"
path = "src/main.rs"

[dependencies]
craft-a-server-core.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json = "1.0.154"
thiserror.workspace = true
minisign-verify = "0.3.0"
sha2 = "0.11.1"
hex = "0.4.3"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
