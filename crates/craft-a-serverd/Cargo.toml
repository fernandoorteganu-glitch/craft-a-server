[package]
name = "craft-a-serverd"
description = "craft-a-server daemon: server lifecycle, backups, mods, panel and tunnel supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
craft-a-server-core.workspace = true
serde.workspace = true
thiserror.workspace = true
hex = "0.4.3"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "net"] }
