<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
{# htmx must not inject its own <style> or evaluate strings: the CSP forbids both. #}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
<title>{{ title }} - {{ crate::panel::strings::APP_NAME }}</title>
<link rel="stylesheet" href="/static/panel.css">
<script src="/static/htmx.min.js" defer></script>
</head>
{# Every htmx request from a signed-in page carries the CSRF token via this header. #}
<body{% if let Some(token) = csrf_token %} hx-headers='{"X-CSRF-Token": "{{ token }}"}'{% endif %}>
<header class="bar">
<a class="brand" href="/">{{ crate::panel::strings::APP_NAME }}</a>
{% if signed_in %}
<nav class="nav" aria-label="Main">
<a href="/"{% if active == "home" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_HOME }}</a>
<a href="/backups"{% if active == "backups" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_BACKUPS }}</a>
<a href="/players"{% if active == "players" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_PLAYERS }}</a>
<a href="/logs"{% if active == "logs" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_LOGS }}</a>
<a href="/mods"{% if active == "mods" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_MODS }}</a>
<a href="/performance"{% if active == "performance" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_PERFORMANCE }}</a>
<a href="/world"{% if active == "world" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_WORLD }}</a>
<a href="/online"{% if active == "online" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_ONLINE }}</a>
<a href="/settings/devices"{% if active == "settings" %} aria-current="page"{% endif %}>{{ crate::panel::strings::NAV_SETTINGS }}</a>
</nav>
{% endif %}
</header>
<main class="main">
{{ content|safe }}
</main>
<footer class="foot">{{ crate::panel::strings::DISCLAIMER }}</footer>
</body>
</html>
